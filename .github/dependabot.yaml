version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        # Actions that execute with write credentials or attestations remain
        # standalone and always wait for a maintainer approval.
        exclude-patterns:
          - actions/attest-build-provenance
          - googleapis/release-please-action
        # Major updates remain standalone so they can wait for human approval
        # without holding unrelated patch and minor updates in the same PR.
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - github_actions
    # These actions execute inside the privileged workflows — fetch-metadata
    # before the token-bearing steps, create-github-app-token holding the App's
    # private key. Updating their pins is a deliberate human-reviewed change,
    # never an automated PR.
    ignore:
      - dependency-name: dependabot/fetch-metadata
      - dependency-name: actions/create-github-app-token

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - python

  # package.json holds the Node tools CI and the pre-commit hooks run. Without
  # this entry the pin is invisible to Dependabot and goes stale silently,
  # which is the failure the pin exists to prevent.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      node:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Dependabot ignores a label that is not defined in the repository rather
    # than creating it, and `javascript` does not exist yet — so until someone
    # creates it these PRs arrive with `dependencies` alone. Kept rather than
    # dropped: the other two ecosystems each carry an ecosystem label, and one
    # repo-settings step is cheaper than a permanently inconsistent convention.
    labels:
      - dependencies
      - javascript
