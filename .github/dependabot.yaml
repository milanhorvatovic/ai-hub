version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        # Actions that execute with write credentials or attestations remain
        # standalone and always wait for a code-owner approval.
        exclude-patterns:
          - actions/attest-build-provenance
          - googleapis/release-please-action
        # Major updates remain standalone so they can wait for human approval
        # without holding unrelated patch and minor updates in the same PR.
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - github_actions
    # This action executes inside the privileged approval workflow. Updating its
    # pin is a deliberate human-reviewed change, never an automated PR.
    ignore:
      - dependency-name: dependabot/fetch-metadata

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - python

  # package.json holds the Node tools CI and the pre-commit hooks run. Without
  # this entry the pin is invisible to Dependabot and goes stale silently,
  # which is the failure the pin exists to prevent.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      node:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - javascript
