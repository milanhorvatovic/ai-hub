name: Dependabot Auto-Merge

# Ordinary patch and minor updates are approved and armed for squash auto-merge.
# Major and privileged-action updates are armed but wait for a maintainer
# approval. Either veto label is a hard stop.

on:
  # Dependabot events can read Dependabot secrets on pull_request. For
  # Dependabot-created PRs, pull_request_target receives no secrets; this
  # workflow therefore stays on pull_request and never checks out PR code.
  # dependabot.yaml also prevents the bot from updating fetch-metadata, which
  # executes before the token-bearing steps, and create-github-app-token,
  # which holds the App's private key.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  # Normal Dependabot labels arrive immediately after opening. They must not
  # cancel the opening run; a veto label must cancel it immediately.
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'trust-boundary' || github.event.label.name == 'security-review-required' }}

jobs:
  auto-merge:
    if: >-
      github.event.action != 'labeled' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report auto-merge switch state
        env:
          ENABLED: ${{ vars.DEPENDABOT_AUTOMERGE_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${ENABLED:-}" == "true" ]]; then
            echo "DEPENDABOT_AUTOMERGE_ENABLED=true; Dependabot autonomy is active."
          else
            echo "::notice::DEPENDABOT_AUTOMERGE_ENABLED is '${ENABLED:-<unset>}'; approval and auto-merge are disabled."
          fi

      # Mint a short-lived oss-automation-bot token for the approval and auto-merge
      # calls. The triggering actor picks the
      # secret store: Dependabot's own events read the Dependabot store, while a
      # maintainer's label events on this same workflow — and the reconciler — read
      # the Actions store, which is why the pair must exist in both stores
      # (docs/adr/0002-automation-identity.md). Skipped when the kill switch is off or
      # a veto label is present, so a dormant repository never fails on absent secrets.
      - name: Mint the automation-bot token
        id: bot-token
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'trust-boundary') && !contains(github.event.pull_request.labels.*.name, 'security-review-required') && vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OSS_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OSS_AUTOMATION_BOT_PRIVATE_KEY }}

      - name: Approve eligible update
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' && !contains(steps.metadata.outputs.dependency-names, 'actions/attest-build-provenance') && !contains(steps.metadata.outputs.dependency-names, 'googleapis/release-please-action') && !contains(github.event.pull_request.labels.*.name, 'trust-boundary') && !contains(github.event.pull_request.labels.*.name, 'security-review-required') && vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          has_veto=$(gh pr view "$PR_URL" --json labels --jq 'any(.labels[]; .name == "trust-boundary" or .name == "security-review-required")')
          if [[ "$has_veto" == "true" ]]; then
            echo "A veto label was added after the workflow started; skipping approval."
            exit 0
          fi

          gh pr review --approve \
            --body "Auto-approved by the Dependabot Auto-Merge workflow (patch/minor update with no veto label)." \
            "$PR_URL"

      - name: Arm squash auto-merge
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'trust-boundary') && !contains(github.event.pull_request.labels.*.name, 'security-review-required') && vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          has_veto=$(gh pr view "$PR_URL" --json labels --jq 'any(.labels[]; .name == "trust-boundary" or .name == "security-review-required")')
          if [[ "$has_veto" == "true" ]]; then
            echo "A veto label was added after the workflow started; refusing to arm auto-merge."
            exit 0
          fi

          gh pr merge --auto --squash "$PR_URL" 2>&1 || true
          state=""
          for attempt in {1..6}; do
            state=$(gh pr view "$PR_URL" --json state,autoMergeRequest)
            pr_state=$(jq -r '.state' <<<"$state")
            armed=$(jq -r '.autoMergeRequest != null' <<<"$state")
            if [[ "$pr_state" == "MERGED" || "$pr_state" == "CLOSED" || "$armed" == "true" ]]; then
              echo "PR is ${pr_state}; auto-merge armed=${armed}."
              exit 0
            fi
            [[ "$attempt" -eq 6 ]] || sleep 2
          done

          echo "::error::The PR remains open without auto-merge. Confirm Allow auto-merge is enabled and the App installation has Contents and Pull requests write access."
          exit 1

  disable-auto-merge-on-veto-label:
    if: >-
      github.event.action == 'labeled' && (github.event.label.name == 'trust-boundary' || github.event.label.name == 'security-review-required') && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Disarming acts as oss-automation-bot too. Minting is unconditional here: a veto hold must be enforced even while the
      # kill switch is off, and a run that cannot mint must fail red rather than leave
      # auto-merge armed.
      - name: Mint the automation-bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OSS_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.OSS_AUTOMATION_BOT_PRIVATE_KEY }}

      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --disable-auto "$PR_URL" 2>&1 || true
          auto_merge=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest')
          if [[ "$auto_merge" != "null" ]]; then
            echo "::error::Auto-merge is still enabled after applying a veto label."
            exit 1
          fi

          echo "Auto-merge is disabled for the veto-label hold."
