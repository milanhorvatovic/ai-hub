name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-test.txt"
      - ".python-version"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v5.6.0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest -q

      # Report-only. The blocking half ran above, where a baseline that no
      # longer describes the tree fails; this just shows what moved. One leg
      # writes it, because four copies of one table is not four reports.
      #
      # The comparison point is the PR's own base commit, not the tip of the
      # base branch: the tip moves as other PRs merge, which would fold their
      # deltas into this summary and make it disagree with the diff a reviewer
      # is reading. Fetching that one commit keeps the checkout shallow, and
      # the ref reaches git through the environment so it can never be shell.
      - name: Report context-cost deltas
        if: >-
          github.event_name == 'pull_request'
          && matrix.os == 'ubuntu-latest'
          && matrix.python == '3.13'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE: tests/skills/context-cost-baseline.json
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:$BASELINE" > "$RUNNER_TEMP/base-cost.json" 2>/dev/null || true
          python .github/scripts/report_context_cost.py \
            "$RUNNER_TEMP/base-cost.json" "$BASELINE" >> "$GITHUB_STEP_SUMMARY"
