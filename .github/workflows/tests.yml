name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-test.txt"
      - ".python-version"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest -q

  # Report-only, and in its own job for one reason: it needs history, and the
  # pytest legs are deliberately shallow. Nothing here gates — the blocking half
  # is the staleness check inside the suite.
  context-cost:
    name: context cost
    if: github.event_name == 'pull_request'
    # The report reads the committed baseline rather than measuring, so it is
    # only meaningful once the suite has confirmed that baseline still describes
    # the tree. Without this the two run concurrently and a stale record renders
    # as "No context-cost change" beside a failing test.
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the comparison needs a real merge base, and a shallow
      # clone cannot produce one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      # On a pull_request event this checkout is the merge commit, so its first
      # parent is the base branch and its second is the PR head. Both endpoints
      # come from commits rather than the working tree, and they are exactly the
      # ends of GitHub's three-dot diff: the merge base, and the head. Neither
      # obvious shortcut works — `base.sha` is the base branch tip at event time
      # and drifts as other pull requests merge, and the merge tree carries
      # whatever landed on the base after this branch diverged. Either one
      # attributes somebody else's change to this pull request.
      - name: Report context-cost deltas
        env:
          BASELINE: tests/skills/context-cost-baseline.json
        run: |
          merge_base=$(git merge-base HEAD^1 HEAD^2)
          echo "comparing $merge_base (merge base) against $(git rev-parse HEAD^2) (head)"
          git show "$merge_base:$BASELINE" > "$RUNNER_TEMP/base-cost.json" 2>/dev/null || true
          git show "HEAD^2:$BASELINE" > "$RUNNER_TEMP/head-cost.json" 2>/dev/null || true
          python .github/scripts/report_context_cost.py \
            "$RUNNER_TEMP/base-cost.json" "$RUNNER_TEMP/head-cost.json" >> "$GITHUB_STEP_SUMMARY"
