name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-test.txt"
      - ".python-version"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v5.6.0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: pytest -q

  # Report-only, and in its own job for one reason: it needs history, and the
  # pytest legs are deliberately shallow. Nothing here gates — the blocking half
  # is the staleness check inside the suite.
  context-cost:
    name: context cost
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the comparison needs a real merge base, and a shallow
      # clone cannot produce one. actions/checkout v4.3.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      # On a pull_request event this checkout is the merge commit, so its first
      # parent is the base branch and its second is the PR head. The merge base
      # of those two is the commit GitHub's three-dot diff is computed against —
      # not `base.sha`, which is the base branch tip at event time and drifts as
      # other pull requests merge. Using the tip would attribute their changes,
      # in reverse, to this one.
      - name: Report context-cost deltas
        env:
          BASELINE: tests/skills/context-cost-baseline.json
        run: |
          merge_base=$(git merge-base HEAD^1 HEAD^2)
          echo "comparing against merge base $merge_base"
          git show "$merge_base:$BASELINE" > "$RUNNER_TEMP/base-cost.json" 2>/dev/null || true
          python .github/scripts/report_context_cost.py \
            "$RUNNER_TEMP/base-cost.json" "$BASELINE" >> "$GITHUB_STEP_SUMMARY"
