name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or SHA to bundle for a manual build; empty = the ref this run checks out"
        required: false
        default: ""
      catalog_tag:
        description: "CalVer Release tag (e.g. v2026.05.0) to publish index.json to; empty = dry run"
        required: false
        default: ""

# Floor is read-only; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # Only the push pipeline cuts releases; workflow_dispatch is a bundle-only path.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # googleapis/release-please-action v4.4.1
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Release path: bundle, sign, and attach the skills that just released. Write-privileged
  # because it uploads release assets and signs provenance.
  bundle:
    name: bundle
    needs: [release-please]
    if: github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sigstore keyless signing (OIDC)
      attestations: write # build-provenance attestation
    steps:
      # actions/checkout v4.3.0 — full history + tags so `git archive <tag>` resolves the
      # per-skill tags release-please just created.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # actions/setup-python v5.6.0 — the builder is stdlib-only, so no install step.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      # Bundle exactly the skills that released, one dir each.
      - name: Build released bundles
        id: build
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          uploads='{}'
          for path in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
            skill="${path#skills/}"
            version="$(jq -r --arg p "$path" '.[$p]' .release-please-manifest.json)"
            tag="$skill-v$version"
            python .github/scripts/build_bundles.py --ref "$tag" --skill "$skill" --out "dist/$skill"
            uploads="$(echo "$uploads" | jq --arg t "$tag" --arg d "dist/$skill" '. + {($t): $d}')"
          done
          echo "uploads=$(echo "$uploads" | jq -c .)" >> "$GITHUB_OUTPUT"

      # github/actions attest-build-provenance v4.1.0 — keyless sigstore + SLSA provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/**/*.zip"

      - name: Upload assets to releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOADS: ${{ steps.build.outputs.uploads }}
        run: |
          echo "$UPLOADS" | jq -r 'to_entries[] | .key + " " + .value' | while read -r tag dir; do
            gh release upload "$tag" "$dir"/*.zip "$dir/SHA256SUMS" --clobber
          done

  # Manual catalog cut: build the catalog and publish + attest index.json to a hand-applied
  # CalVer Release. Write-privileged because it uploads and signs.
  catalog-publish:
    name: catalog-publish
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the manifest to the CalVer Release
      id-token: write # sigstore keyless signing (OIDC)
      attestations: write # build-provenance attestation
    steps:
      # actions/checkout v4.3.0 — full history + tags; check out the requested ref (empty = default).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      - name: Build catalog
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
          CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          # Empty input means "the ref this run already checked out".
          python .github/scripts/build_bundles.py \
            --ref "${REF:-HEAD}" --out dist --index --repo "$REPO" --catalog "$CATALOG_TAG"

      # github/actions attest-build-provenance v4.1.0 — provenance for the catalog manifest.
      - name: Attest catalog provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/index.json"

      # The CalVer Release is created by hand; this attaches the manifest, which points across
      # to each skill's own release assets, so no bundles are duplicated here.
      - name: Publish catalog to the CalVer Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: gh release upload "$CATALOG_TAG" dist/index.json --clobber

  # Manual dry run: build the catalog and publish it as a workflow artifact for inspection.
  # Read-only — it neither uploads to a Release nor signs anything.
  catalog-preview:
    name: catalog-preview
    if: github.event_name == 'workflow_dispatch' && inputs.catalog_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v4.3.0 — full history + tags; check out the requested ref (empty = default).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      - name: Build catalog
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Empty input means "the ref this run already checked out".
          python .github/scripts/build_bundles.py --ref "${REF:-HEAD}" --out dist --index --repo "$REPO"

      # actions/upload-artifact v7.0.1
      - name: Publish catalog as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skill-bundles
          path: dist/
