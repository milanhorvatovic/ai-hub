name: change-intent

# Gate: every PR must declare its change intent as a Conventional-Commit title.
# The squash-merge subject is the PR title, which release-please parses to compute
# per-skill version bumps — so the title must be parseable and correctly scoped.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: change-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.3.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      # actions/setup-python v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"

      - name: Validate PR title
        # PR title is untrusted input — pass it via env, never interpolated into the shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/validate_pr_title.py
