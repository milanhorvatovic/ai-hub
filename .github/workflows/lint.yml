name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Path filters are workflow-level, so this is the union of both jobs'
    # inputs — a markdown-only push also starts ruff, and a Python-only push
    # also starts prettier. Both are seconds long; a per-job filter would take
    # two workflow files, which costs more than the duplicate runs do.
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".python-version"
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "**/*.mjs"
      - "requirements-test.txt"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      # Pinned to match .pre-commit-config.yaml's ruff rev.
      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Run ruff
        run: ruff check .

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` installs exactly what package-lock.json records. `npm install`
      # may resolve a different prettier, which is how CI starts disagreeing
      # with the hook contributors run locally.
      - name: Install the pinned toolchain
        run: npm ci

      # The glob and the config live in package.json so the hook, CI, and a
      # contributor typing `npm run format:check` all run the same command.
      - name: Check markdown formatting
        run: npm run format:check

  # The code samples are parsed here rather than in the tests workflow so the npm
  # registry stays a dependency of one job instead of four required ones. The
  # lanes are ordinary pytest tests that skip where their parser is absent; this
  # is the job that guarantees somewhere they do not skip.
  code-samples:
    name: code-samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the pinned toolchain
        run: npm ci

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # The image ships a shellcheck and the shell lane must not be graded by
      # whichever one that is: a reclassified diagnostic would redden a pull
      # request that changed nothing, which is the floating-version failure this
      # repository publishes a skill to find. Pinned by version and verified by
      # digest, because a release asset can be replaced without its URL moving.
      - name: Install the pinned shellcheck
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C bin --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A lane skips where its parser is missing, which is right on a
      # contributor's machine and wrong here — a skipped lane in the job that
      # exists to run it is a green tick over an unchecked sample. The variable
      # turns those skips into failures, so a broken install reports as one.
      - name: Check code samples
        env:
          REQUIRE_SAMPLE_LANES: "1"
        run: pytest tests/skills/test_code_samples.py -q
