name: lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Path filters are workflow-level, so this is the union of both jobs'
    # inputs — a markdown-only push also starts ruff, and a Python-only push
    # also starts prettier. Both are seconds long; a per-job filter would take
    # two workflow files, which costs more than the duplicate runs do.
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".python-version"
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v6.2.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"

      # Pinned to match .pre-commit-config.yaml's ruff rev.
      - name: Install ruff
        run: pip install ruff==0.8.6

      - name: Run ruff
        run: ruff check .

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-node v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` installs exactly what package-lock.json records. `npm install`
      # may resolve a different prettier, which is how CI starts disagreeing
      # with the hook contributors run locally.
      - name: Install the pinned toolchain
        run: npm ci

      # The glob and the config live in package.json so the hook, CI, and a
      # contributor typing `npm run format:check` all run the same command.
      - name: Check markdown formatting
        run: npm run format:check
