# Opt-in developer hooks. Install with `pre-commit install`.
# Hooks run on changed files only, so they won't trip on as-yet-unnormalized files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: prettier
        name: prettier (markdown, proseWrap:never)
        entry: prettier --write
        language: system
        types_or: [markdown]
